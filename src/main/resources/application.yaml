# Every connection setting reads an environment variable and falls back to a local default.
# The defaults are local-only credentials for the synthetic database, not secrets.
spring:
  application:
    name: eligibility-benefits-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eligibility}
    username: ${DB_USERNAME:eligibility}
    password: ${DB_PASSWORD:eligibility}
  flyway:
    # Flyway owns the schema: migrations in db/migration run at startup.
    locations: classpath:db/migration
  jpa:
    # Hibernate checks the schema against the entities and never changes it,
    # so the service refuses to start when the two disagree.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

# springdoc serves the OpenAPI document at /v3/api-docs. The committed copy, docs/api/openapi.json,
# must match it: ApiContractTest fails the build when the two differ.
springdoc:
  default-produces-media-type: application/json
  # Pretty-printed so a regenerated contract file has a readable diff.
  writer-with-default-pretty-printer: true
  model-converters:
    # Fields marked @Nullable, such as an ongoing Coverage's end date, are documented as nullable.
    java-nullable-property-customizer:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
