name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Includes the Testcontainers tests; the runner provides Docker.
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  compose-smoke:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --detach --build
      - name: Wait for health UP
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Health is UP"
              exit 0
            fi
            sleep 2
          done
          echo "Service never reported UP" >&2
          exit 1
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
